name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 19000:9000 \
            -e MINIO_ROOT_USER=testkey -e MINIO_ROOT_PASSWORD=testsecret123 \
            minio/minio server /data
          timeout 60 sh -c 'until curl -sf http://127.0.0.1:19000/minio/health/live; do sleep 1; done'
      - run: npm test
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:19000

      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: tabby-s3
          path: tabby-s3-*.tgz
      - name: Attach the package to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tabby-s3-*.tgz
