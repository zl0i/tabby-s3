name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # MinIO no longer publishes images; RustFS is an S3-compatible server that checks signatures like it
      - name: Start an S3 server
        run: |
          docker run -d --name s3 -p 19000:9000 \
            -e RUSTFS_ACCESS_KEY=testkey -e RUSTFS_SECRET_KEY=testsecret123 \
            rustfs/rustfs:1.0.1
          timeout 60 sh -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:19000/)" = 403 ]; do sleep 1; done'
      - run: npm test
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:19000

      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: tabby-s3
          path: tabby-s3-*.tgz
      - name: Attach the package to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tabby-s3-*.tgz
